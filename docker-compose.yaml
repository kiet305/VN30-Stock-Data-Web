services:
  psql:
    image: postgres:18.4
    container_name: psql
    ports:
      - "5400:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./pgdata}
        target: /var/lib/postgresql

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    ports:
      - "9004:9000"
      - "9005:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - type: bind
        source: ${MINIO_DATA_DIR:-./minio}
        target: /data

  mc:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mc
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio'; sleep 1;
      done;
      mc mb minio/warehouse || true;
      mc anonymous set download minio/warehouse;
      exit 0;
      "
